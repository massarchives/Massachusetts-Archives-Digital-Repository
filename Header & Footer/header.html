<html>
	<head>
		<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<style>
			@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			body {
				font-family: 'Space Grotesk', sans-serif;
				background-color: #FAFAFA;
			}
			/* ── Header ── */
			.header {
				padding: 24px 28px;
				text-align: right;
				position: relative;
				background-image: url("https://digitalarchives.sec.state.ma.us/wp-content/uploads/2024/08/galvin-header-background-wide.png");
				background-position: left center;
				background-repeat: no-repeat;
				background-size: cover;
			}
			.header::after {
				content: '';
				position: absolute;
				inset: 0;
				background: linear-gradient(to right, transparent 0%, transparent 30%, #fafafa 75%);
				pointer-events: none;
			}
			.header-content {
				position: relative;
				z-index: 1;
			}
			.sec-banner-name {
				font-family: 'Space Grotesk', sans-serif;
				font-size: 15px;
				color: #17183b;
				font-weight: 600;
				line-height: 130%;
				margin: 0 0 3px 0;
				letter-spacing: -0.01em;
			}
			.sec-banner-name a {
				font-family: 'Space Grotesk', sans-serif;
				font-size: 15px;
				font-weight: 600;
				letter-spacing: -0.01em;
				color: #17183b;
				text-decoration: none;
				opacity: 1;
			}

			.sec-banner-name a:hover {
				opacity: 0.7;
			}

			.sec-banner-title {
				font-family: 'Space Grotesk', sans-serif;
				font-size: 10px;
				color: #17183b;
				font-weight: 500;
				line-height: 140%;
				margin: 0;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				opacity: 0.7;
			}

			/* ── Nav ── */
			.topnav {
				background-color: #E8E8EB;
				display: flex;
				align-items: stretch;
				padding: 0 16px;
				position: relative;
			}
			.topnav a {
				color: #17183b;
				padding: 20px 15px;
				text-decoration: none;
				font-size: 15px;
				font-family: 'Space Grotesk', sans-serif;
				font-weight: 600;
				white-space: nowrap;
				border-bottom: 2px solid transparent;
				transition: border-color 0.15s ease;
			}
			.topnav a:hover {
				border-bottom-color: #B9BAC4;
				text-decoration: none;
			}
			.topnav .icon {
				display: none;
			}
			/* ── Mobile ── */
			@media screen and (max-width: 980px) {
				.header {
					padding: 24px 20px;
					text-align: center;
				}
				.topnav {
					flex-wrap: wrap;
					padding: 0 8px;
				}
				.topnav a:not(.icon) {
					display: none;
				}
				.topnav .icon {
					display: flex;
					align-items: center;
					margin-left: auto;
					color: #17183b;
					font-size: 20px;
					padding: 14px 8px;
					border-bottom: none;
					cursor: pointer;
				}
				.topnav.responsive {
					flex-direction: column;
				}
				.topnav.responsive a {
					display: block;
					text-align: left;
					white-space: normal;
					border-bottom: 1px solid rgba(23,24,59,0.12);
					padding: 12px 16px;
					font-size: 15px;
				}
				.topnav.responsive .icon {
					position: absolute;
					top: 0;
					right: 8px;
					border-bottom: none;
				}
			}
		</style>
	</head>
	<body>
		<div class="header">
			<div class="header-content">
				<p class="sec-banner-name"><a href="https://www.sec.state.ma.us/">William Francis Galvin</a></p>
				<p class="sec-banner-title">Secretary of the Commonwealth of Massachusetts</p>
			</div>
		</div>
		<div class="topnav" id="myTopnav">
			<a href="https://digitalarchives.sec.state.ma.us/">Home</a>
			<a href="https://digitalarchives.sec.state.ma.us/about/">About</a>
			<a href="https://digitalarchives.sec.state.ma.us/collections/">Collections</a>
			<a href="https://digitalarchives.sec.state.ma.us/exhibits/">Exhibits</a>
			<a href="https://digitalarchives.sec.state.ma.us/guides/">Guides</a>
			<a href="https://digitalarchives.sec.state.ma.us/archive/">Complete Archive</a>
			<a href="https://digitalarchives.sec.state.ma.us/rev250/">Revolution 250</a>
			<a href="javascript:void(0);" class="icon" onclick="myFunction()">
				<i class="fa fa-bars"></i>
			</a>
		</div>
		<script>
			function myFunction() {
				var x = document.getElementById("myTopnav");
				if (x.className === "topnav") {
					x.className += " responsive";
				} else {
					x.className = "topnav";
				}
			}
		</script>
	</body>
</html>
